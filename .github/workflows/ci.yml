name: ci

on:
  push:
    branches: [main, "factory/**"]
  pull_request:

jobs:
  # Single-job CI shares one install/import cache.
  # Ordering invariant: steps must stay ordered `Import project` -> consumers
  # (`Run headless tests`, `Autoplay verdict`, `Export Web`). Any future
  # matrix/multi-job split must chain jobs with `needs:` starting from an
  # import job and must reuse the same `.godot/` cache key below.
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Toolchain check
        timeout-minutes: 5
        run: |
          godot --version | tee version.txt
          grep -q "4.7.stable" version.txt
          test -f project.godot
          test -f .github/workflows/ci.yml

      - name: Restore import cache
        uses: actions/cache@v4
        with:
          path: .godot/
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', 'export_presets.cfg', '**/*.gd', '**/*.tscn', '**/*.tres') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      - name: Import project
        timeout-minutes: 10
        run: godot --headless --path . --import

      - name: Verify import-before-test ordering
        timeout-minutes: 5
        run: |
          test -d .godot || { echo "import cache missing: Import project must run before tests/autoplay/export"; exit 1; }

      - name: Reference check
        timeout-minutes: 5
        run: python3 .agents/skills/godot-nodes-scenes/scripts/check_godot_project.py .

      - name: Run headless tests
        timeout-minutes: 5
        run: godot --headless --path . --script res://tests/test_runner.gd

      - name: Autoplay verdict (60 simulated seconds)
        timeout-minutes: 10
        run: |
          godot --headless --path . --script res://autopilot/autopilot.gd > autoplay.log 2>&1
          code=$?
          cat autoplay.log
          if grep -q "SCRIPT ERROR" autoplay.log; then
            echo "autoplay: SCRIPT ERROR found in log"
            exit 1
          fi
          grep -q "AUTOPLAY_VERDICT.*ERRORS=0" autoplay.log
          sim=$(grep -o "SIM_SECONDS=[0-9.]*" autoplay.log | head -n 1 | cut -d= -f2)
          test -n "$sim"
          awk "BEGIN { exit !( ${sim} + 0 >= 60 ) }"
          grep -q "MEASURED_SECONDS=[0-9.]*" autoplay.log
          grep -q "WALL_SECONDS=[0-9.]*" autoplay.log
          grep -q "FRAMES=[0-9]*" autoplay.log
          measured=$(grep -o "MEASURED_SECONDS=[0-9.]*" autoplay.log | head -n 1 | cut -d= -f2)
          test -n "$measured"
          awk "BEGIN { exit !( ${measured} + 0 >= 55 ) }"
          wall=$(grep -o "WALL_SECONDS=[0-9.]*" autoplay.log | head -n 1 | cut -d= -f2)
          test -n "$wall"
          awk "BEGIN { exit !( ${wall} + 0 >= 50 ) }"
          exit $code

      - name: Export Web
        timeout-minutes: 10
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          ls -la build/web/

      - name: Serve and verify over HTTP
        timeout-minutes: 5
        run: |
          python3 serve.py 8123 --directory build/web > serve.log 2>&1 &
          srv=$!
          trap "kill $srv" EXIT
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8123/index.html; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:8123/index.html
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8123/does-not-exist)
          test "$code" = "404"
          code=$(curl -s -o /dev/null -w '%{http_code}' --path-as-is "http://localhost:8123/%00" || true)
          test "$code" = "400" || { echo "malformed path /%00 -> [$code], want 400"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --path-as-is "http://localhost:8123/%00.html" || true)
          test "$code" = "400" || { echo "malformed path /%00.html -> [$code], want 400"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --path-as-is "http://localhost:8123/%ZZ" || true)
          test "$code" = "404" || { echo "malformed path /%ZZ -> [$code], want 404"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --path-as-is "http://localhost:8123/%" || true)
          test "$code" = "404" || { echo "malformed path /% -> [$code], want 404"; exit 1; }
          wasm=$(ls build/web/*.wasm) || { echo "no .wasm payload in build/web"; exit 1; }
          wasm=$(echo "$wasm" | head -n 1)
          base=$(basename "$wasm")
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8123/$base")
          test "$code" = "200" || { echo ".wasm $base -> [$code], want 200"; exit 1; }
          curl -s -D - -o /dev/null "http://localhost:8123/$base" | grep -qi 'content-type:.*application/wasm' || { echo ".wasm $base missing Content-Type: application/wasm"; exit 1; }
          kill $srv
          trap - EXIT

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web/
